# Supabase 무료 플랜은 일주일간 접속이 없으면 정지됩니다. 이틀에 한 번 가볍게 깨웁니다.
# 저장소 Settings → Secrets and variables → Actions 에 SUPABASE_URL, SUPABASE_ANON_KEY 를 등록하세요.
name: supabase-keepalive
on:
  schedule: [{ cron: '17 3 */2 * *' }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/ion_items?select=k&limit=1" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" -o /dev/null
